<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<!-- One palette for every KIT product (Nikita 2026-10-27/30). Values from ../colors_and_type.css. -->
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-sans); background: #fff; color: var(--kit-blue); }
  .grid { display: grid; grid-template-columns: 150px 1fr 1fr; gap: 10px 14px; align-items: center; max-width: 820px; }
  .h { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--kit-slate); }
  .role { font-size: 14px; font-weight: 700; }
  .sw { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--kit-border);
    font: 600 13px/1 var(--font-mono); }
  .sw.d { border-color: var(--kit-dark-border); }
  .sw span { margin-left: auto; font: 600 13px/1 var(--font-sans); }
</style></head><body>
<div class="grid" id="g">
  <div></div><div class="h">Light</div><div class="h">Dark</div>
</div>
<script>
const v = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rows = [
  ['Background', '--kit-canvas', '--kit-dark-bg'],
  ['Card', '--kit-white', '--kit-dark-surface'],
  ['Line', '--kit-border', '--kit-dark-border'],
  ['Text', '--kit-blue', '--kit-dark-text1'],
  ['Second text', '--kit-slate', '--kit-dark-text3'],
  ['Main button', '--kit-blue', '--kit-sky', 'Done', 'Done'],
  ['Accent', '--kit-sky', '--kit-sky'],
  ['Error', '--kit-error', '--kit-error-dark'],
  ['Ready', '--kit-ready', '--kit-ready-dark'],
  ['Preparing', '--kit-preparing', '--kit-preparing'],
];
const lum = (h) => { const c = [1,3,5].map(i => parseInt(h.slice(i,i+2),16)/255).map(x => x <= .03928 ? x/12.92 : ((x+.055)/1.055)**2.4); return .2126*c[0]+.7152*c[1]+.0722*c[2]; };
const g = document.getElementById('g');
for (const [name, l, d, tl, td] of rows) {
  g.insertAdjacentHTML('beforeend', `<div class="role">${name}</div>`);
  for (const [tok, dark, word] of [[l, false, tl], [d, true, td]]) {
    const hex = v(tok); const ink = lum(hex) > .4 ? '#1d3557' : (dark && tok === '--kit-sky' ? '#12161c' : '#fff');
    g.insertAdjacentHTML('beforeend', `<div class="sw${dark ? ' d' : ''}" style="background:${hex};color:${ink}">${hex}${word ? `<span>${word}</span>` : ''}</div>`);
  }
}
</script>
</body></html>
