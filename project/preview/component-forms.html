<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-sans); background: #fff; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .field { flex: 1; min-width: 160px; }
  label { font-size: 12px; font-weight: 600; color: #1d3557; display: block; margin-bottom: 5px; }
  input, select, textarea { width: 100%; box-sizing: border-box; border: 1.5px solid #e4e9f0; border-radius: 14px; padding: 9px 13px; font-size: 13px; color: #1d3557; font-family: inherit; background: #fff; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: #1d3557; box-shadow: 0 0 0 3px rgba(29,53,87,0.08); }
  input::placeholder { color: #94a3b8; }
  textarea { height: 60px; resize: none; }
</style></head><body>
<div class="row">
  <div class="field"><label>Business name</label><input placeholder="Favorite Mart"></div>
  <div class="field"><label>Store type</label><select><option>Grocery store</option><option>Liquor store</option><option>Smoke shop</option><option>QSR</option></select></div>
  <div class="field" style="flex:100%"><label>Message</label><textarea placeholder="Tell us about your setup needs…"></textarea></div>
</div>
</body></html>
