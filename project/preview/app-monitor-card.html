<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="../apps/kit-apps.css">
<style>body{margin:0;padding:20px 24px;font-family:var(--font-sans);background:#F0F2F5;color:#1D3557} .lbl{font:600 12px/1.4 var(--font-sans);color:#5f6b7a;margin:18px 0 8px} .board{display:grid;grid-template-columns:1fr 1fr;gap:20px}.col{display:grid;gap:12px;align-content:start}.h{font:800 22px/1 var(--font-sans);color:#5f6b7a;margin-bottom:4px}.kit-order__name{font-size:40px}</style></head><body>
<div class="lbl">R2 + O1: JONATHAN turns ready, travels from PREPARING to READY, turns green, then one pass of light runs along the ribbon. Replays every 5 s here; once on a real screen.</div>
<div class="board"><div class="col" id="prep"><div class="h">PREPARING</div><div class="kit-order" id="c1"><span class="kit-order__stub">TABLE<b>T1</b></span><span class="kit-order__name">DAVID</span><span class="kit-order__no">1041</span><span class="kit-order__status">Pickup</span></div><div class="kit-order" id="c2"><span class="kit-order__stub">TO GO<b><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></b></span><span class="kit-order__name">JONATHAN</span><span class="kit-order__no">1043</span><span class="kit-order__status">Pickup</span><svg class="kit-order__o1" viewBox="0 0 620 96" preserveAspectRatio="none" aria-hidden="true"><defs><clipPath id="o1r2"><path d="M-30,112 C150,-8 450,-4 650,82 C450,3 150,-1 -30,112z"/></clipPath><linearGradient id="o1l2" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".55" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="M-30,112 C150,-8 450,-4 650,82 C450,3 150,-1 -30,112z" fill="#fff" fill-opacity=".1"/><g clip-path="url(#o1r2)"><rect class="kit-o1-light" x="0" y="0" width="150" height="96" fill="url(#o1l2)"/></g></svg></div></div><div class="col" id="ready"><div class="h">READY</div><div class="kit-order is-ready" id="c3"><span class="kit-order__stub">TABLE<b>T4</b></span><span class="kit-order__name">MAYA</span><span class="kit-order__no">1040</span><span class="kit-order__status">READY</span></div></div></div>
<script src="../apps/kit-ready.js"></script><script>
var c=document.getElementById('c2'),prep=document.getElementById('prep'),ready=document.getElementById('ready');
function reset(){c.classList.remove('is-ready','just-ready');c.querySelector('.kit-order__status').textContent='Pickup';prep.appendChild(c);}
function run(){reset();setTimeout(function(){c.querySelector('.kit-order__status').textContent='READY';kitReadyMove(c,ready);},900);}
run();setInterval(run,5000);
</script>
</body></html>
