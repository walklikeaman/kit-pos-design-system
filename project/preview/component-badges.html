<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-sans); background: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .badge { display: inline-flex; align-items: center; border-radius: 9999px; font-size: 11px; font-weight: 600; padding: 4px 12px; }
  .badge-blue { background: #1d35571a; color: #1d3557; }
  .badge-mist { background: #f4f7fb; color: #5f6b7a; border: 1px solid #e4e9f0; }
  .badge-sky { background: #e0f2fe; color: #0369a1; }
  .badge-outline { background: transparent; color: #5f6b7a; border: 1px solid #e4e9f0; }
  .tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 9999px; font-size: 11px; font-weight: 500; padding: 5px 12px; background: #f4f7fb; color: #1d3557; border: 1px solid #e4e9f0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.6; }
</style></head><body>
<div class="row">
  <span class="badge badge-blue">Boutique POS Solutions</span>
  <span class="badge badge-mist">Product Ecosystem</span>
  <span class="badge badge-sky">Support</span>
  <span class="badge badge-outline">FAQ</span>
</div>
<div class="row" style="margin-top:12px">
  <span class="tag"><span class="dot"></span>Grocery store</span>
  <span class="tag"><span class="dot"></span>Liquor store</span>
  <span class="tag"><span class="dot"></span>Smoke shop</span>
  <span class="tag"><span class="dot"></span>QSR</span>
  <span class="tag"><span class="dot"></span>Supermarket</span>
</div>
</body></html>
