<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-sans); background: #12161c; }
  .row { display: flex; gap: 12px; }
  .swatch { flex: 1; border-radius: 12px; overflow: hidden; border: 1px solid #2c3540; }
  .chip { height: 64px; }
  .info { padding: 8px 10px 10px; }
  .name { font-size: 12px; font-weight: 600; color: #e6eaf0; }
  .val { font-size: 11px; color: #9aa6b4; margin-top: 2px; font-family: monospace; }
</style></head><body>
<div class="row">
  <div class="swatch">
    <div class="chip" style="background:#12161c"></div>
    <div class="info"><div class="name">dark-bg</div><div class="val">#12161c</div></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#1b2129"></div>
    <div class="info"><div class="name">dark-surface</div><div class="val">#1b2129</div></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#2c3540"></div>
    <div class="info"><div class="name">dark-border</div><div class="val">#2c3540</div></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#0ea5e9"></div>
    <div class="info"><div class="name">kit-sky</div><div class="val">#0ea5e9</div></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#e6eaf0"></div>
    <div class="info"><div class="name">dark-text1</div><div class="val">#e6eaf0</div></div>
  </div>
</div>
</body></html>
