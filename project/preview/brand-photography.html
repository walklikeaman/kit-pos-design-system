<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; font-family: var(--font-sans); background: #f4f7fb; }
  .row { display: flex; gap: 12px; }
  .img-box { flex: 1; border-radius: 18px; overflow: hidden; position: relative; border: 1px solid #e4e9f0; }
  img { width: 100%; height: 110px; object-fit: cover; display: block; }
  .caption { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(29,53,87,0.5)); padding: 12px 10px 8px; }
  .cap-text { font-size: 11px; font-weight: 600; color: #fff; }
</style></head><body>
<div class="row">
  <div class="img-box">
    <img src="../assets/interior-counter-checkout.png" alt="Store counter">
    <div class="caption"><div class="cap-text">Interior — warm, natural light</div></div>
  </div>
  <div class="img-box">
    <img src="../assets/hardware-d3-pro.png" alt="SUNMI D3 Pro" style="object-fit:contain;background:#fff">
    <div class="caption"><div class="cap-text">Hardware — white bg product shot</div></div>
  </div>
  <div class="img-box">
    <img src="../assets/kit-pos-screen-2.png" alt="KIT POS screen" style="object-fit:contain;background:#f4f7fb">
    <div class="caption"><div class="cap-text">Software — neutral frame</div></div>
  </div>
</div>
</body></html>
