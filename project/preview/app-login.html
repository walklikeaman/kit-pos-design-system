<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIT login L1</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../apps/kit-apps.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--kit-app-bg); }
  .next { position: fixed; inset: 0; background: var(--kit-app-bg) center top / cover no-repeat; opacity: 0; }
  .kit-login { position: fixed; inset: 0; }
  .ctl { position: fixed; right: 10px; bottom: 10px; display: flex; gap: 6px; z-index: 99; font: 600 12px/1 system-ui, sans-serif; }
  .ctl button { border: 0; border-radius: 999px; padding: 8px 12px; background: #000a; color: #fff; cursor: pointer; }
  /* The camera sheet, drawn only for the demo: the app opens its own scanner. */
  .cam { position: fixed; inset: 0; z-index: 60; background: #0b0f14; display: grid; place-items: center; }
  .cam i { width: 220px; height: 220px; border: 3px solid #fff; border-radius: 28px; corner-shape: squircle; box-shadow: 0 0 0 9999px #0008; }
</style>
</head>
<body>
<!--
  Login L1, approved by Nikita 2026-10-26. Params: app=monitor|kitchen|label|invoice,
  scheme=dark, camera=0 (no camera: the scan button is not drawn), auto=1 (loops the demo).
-->
<div class="next" id="next"></div>
<main class="kit-login" id="login">
  <div class="kit-login__col">
    <span class="kit-login__mark" id="mark"></span>
    <div class="kit-login__eyebrow" id="name"></div>
    <h1 class="kit-login__title">Log in</h1>
    <p class="kit-login__lead">Scan your clerk’s KIT POS login code, or type it.</p>
    <form class="kit-login__form" id="form">
      <label class="kit-login__label" for="code">Login code</label>
      <div class="kit-login__row">
        <input class="kit-login__field" id="code" autocomplete="off" inputmode="text">
        <button class="kit-login__scan" id="scan" type="button" aria-label="Scan login code with the camera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M7 12h10"/></svg>
        </button>
      </div>
      <div class="kit-login__error" id="err" role="alert"></div>
      <button class="kit-login__button" id="btn"><span id="batom" style="line-height:0"></span><span id="blabel">Log in</span></button>
      <div class="kit-login__hint">No store yet? Enter <b>demo</b> to try a sample.</div>
    </form>
  </div>
</main>
<div class="ctl"><button data-run="ok">▶ Log in</button><button data-run="scan" id="scanrun">⌗ Scan</button><button data-run="err">✕ Wrong code</button></div>
<script src="../apps/kit-mark.js"></script>
<script>
const q = new URLSearchParams(location.search);
const app = q.get('app') || 'monitor';
const NAMES = { monitor: 'KIT Monitor', kitchen: 'KIT Kitchen', label: 'KIT Label', invoice: 'KIT Invoice' };
// Each app keeps its own words: the wall screens are connected once, the handhelds log in.
const WALL = app === 'monitor' || app === 'kitchen';
const WORDS = WALL ? { title: 'Connect this screen', go: 'Connect', wait: 'Checking…' } : { title: 'Log in', go: 'Log in', wait: 'Logging in…' };
const SRC = '../apps/kit-atom.png';
const R = document.documentElement;
R.className = (q.get('scheme') === 'dark' ? 'kit-dark ' : '') + 'kit-app-' + app;
const $ = (s) => document.querySelector(s);
const login = $('#login'), next = $('#next');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = (ms) => new Promise((r) => setTimeout(r, reduced ? Math.min(ms, 50) : ms));
$('#name').textContent = NAMES[app];
document.querySelector('.kit-login__title').textContent = WORDS.title;
next.style.backgroundImage = `url(img/app-next/${app}.jpg)`;
// Monitor and Kitchen are typed in once on the wall: no scan button (Nikita 2026-10-26).
if (q.get('camera') === '0' || WALL) $('#scan').remove();
const mark = (sheen) => { $('#mark').innerHTML = kitMark({ src: SRC, size: 132, sheen, dur: 1.2 }); };

function reset() {
  document.getAnimations().forEach((a) => a.cancel());
  login.className = 'kit-login'; login.style.visibility = '';
  next.style.opacity = 0; $('#code').value = ''; $('#err').textContent = '';
  $('#batom').innerHTML = ''; $('#blabel').textContent = WORDS.go;
  mark('none');
}

/* Waiting: one sheen pass along the orbits every 1.3 s, on the big atom and
   in the button, for as long as the server takes. The only repeating motion. */
let wait = 0;
function busy(on) {
  login.classList.toggle('is-busy', on);
  clearInterval(wait);
  if (!on) return;
  const put = () => { mark('once'); $('#batom').innerHTML = kitMark({ src: SRC, size: 30, sheen: 'once', dur: 1.2 }); };
  put(); wait = setInterval(put, 1300);
  $('#blabel').textContent = WORDS.wait;
}

async function type(code) { for (const ch of code) { await sleep(160); $('#code').value += ch; } }

async function run(kind) {
  reset();
  await sleep(500);
  $('#code').focus();
  if (kind === 'scan') {
    // Camera or the device's own scanner: the code arrives whole and logs in by itself.
    const cam = document.createElement('div'); cam.className = 'cam'; cam.innerHTML = '<i></i>';
    document.body.appendChild(cam); await sleep(900); cam.remove();
    $('#code').value = '4821';
  } else {
    await type(kind === 'ok' ? '4821' : '4812');
    await sleep(300);
  }
  busy(true);
  await sleep(1500);
  busy(false);
  if (kind === 'err') {
    login.classList.add('is-error'); $('#batom').innerHTML = ''; $('#blabel').textContent = WORDS.go;
    $('#err').textContent = 'That code didn’t match a clerk. Check it in KIT Merchant → Clerks.';
    if (!reduced) $('.kit-login__field').animate([{ transform: 'none' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(7px)' }, { transform: 'translateX(-4px)' }, { transform: 'none' }], { duration: 360, easing: 'ease-out' });
    mark('none');
    return;
  }
  login.classList.add('is-ok'); $('#blabel').textContent = 'Connected';
  $('#batom').innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  await sleep(450);
  mark('once');
  login.classList.add('is-leaving');
  next.animate([{ opacity: 0, transform: 'scale(.97)' }, { opacity: 1, transform: 'none' }], { duration: 700, delay: 300, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' });
  await sleep(1000);
  login.style.visibility = 'hidden';
}

let running = false;
async function go(k) { if (running) return; running = true; try { await run(k); } finally { running = false; } }
document.querySelector('.ctl').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) go(b.dataset.run); });
$('#form').addEventListener('submit', (e) => { e.preventDefault(); go($('#code').value.trim() === 'demo' ? 'ok' : 'err'); });
$('#scan')?.addEventListener('click', () => go('scan'));
if (WALL) $('#scanrun').remove();
reset();
if (q.get('auto')) (async () => { for (;;) { await go('ok'); await sleep(2200); if (!WALL) { await go('scan'); await sleep(2200); } await go('err'); await sleep(2600); } })();
</script>
</body>
</html>
