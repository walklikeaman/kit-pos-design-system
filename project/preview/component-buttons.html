<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-sans); background: #fff; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  /* Primary */
  .btn-primary { background: #1d3557; color: #fff; border: none; border-radius: 9999px; padding: 10px 22px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  /* Ghost */
  .btn-ghost { background: transparent; color: #1d3557; border: 1.5px solid #e4e9f0; border-radius: 9999px; padding: 10px 22px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  /* Mist hover */
  .btn-mist { background: #f0f2f5; color: #1d3557; border: none; border-radius: 9999px; padding: 10px 22px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  /* Small */
  .btn-sm { background: #1d3557; color: #fff; border: none; border-radius: 9999px; padding: 7px 16px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
  /* Dark CTA */
  .btn-sky { background: #0ea5e9; color: #12161c; border: none; border-radius: 9999px; padding: 10px 22px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  /* Disabled */
  .btn-disabled { background: #e4e9f0; color: #94a3b8; border: none; border-radius: 9999px; padding: 10px 22px; font-size: 13px; font-weight: 600; cursor: not-allowed; font-family: inherit; }
  .label { font-size: 10px; color: #94a3b8; margin-top: 6px; text-align: center; font-family: monospace; }
  .item { display: flex; flex-direction: column; align-items: center; }
</style></head><body>
<div class="row">
  <div class="item"><button class="btn-primary">For Partners</button><div class="label">primary</div></div>
  <div class="item"><button class="btn-ghost">Explore Platform</button><div class="label">ghost</div></div>
  <div class="item"><button class="btn-mist">Read full stories</button><div class="label">mist</div></div>
  <div class="item"><button class="btn-sm">Contact</button><div class="label">small</div></div>
  <div class="item"><button class="btn-sky">For Partners</button><div class="label">dark mode CTA</div></div>
  <div class="item"><button class="btn-disabled">Unavailable</button><div class="label">disabled</div></div>
</div>
</body></html>
