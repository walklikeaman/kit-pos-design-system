<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--kit-app-bg); color: var(--kit-app-text); font-family: var(--font-sans); }
  .bar { position: fixed; top: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px;
    background: var(--kit-app-surface); border-bottom: 1px solid var(--kit-app-line); }
  .bar img { width: 32px; height: 32px; }
  .bar b { flex: 1; font-size: 18px; font-weight: 800; }
  .bar .kit-header__more { background: var(--kit-app-raised); color: var(--kit-app-text); }
  .kit-menu { position: fixed; top: 66px; right: 8px; animation: none; }
  .kit-scrim { animation: none; }
  .kit-settings { animation: none; }
  svg { fill: currentColor; }
  /* Controls the rows hold (each app draws them with its own widgets). */
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--kit-app-raised); border: 1px solid var(--kit-app-line); border-radius: 12px; corner-shape: var(--kit-app-shape); }
  .seg span { height: 34px; padding: 0 14px; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--kit-app-muted); border-radius: 9px; corner-shape: var(--kit-app-shape); }
  .seg span.on { background: var(--kit-app-primary); color: var(--kit-app-on-primary); }
  .sw { width: 52px; height: 32px; border-radius: 99px; background: var(--kit-app-line); position: relative; flex: none; }
  .sw::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0003; }
  .sw.on { background: var(--kit-app-primary); } .sw.on::after { left: 24px; background: var(--kit-app-on-primary); }
  .sel { display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 600; }
</style>
</head>

  <div class="kit-menu__item">${i('help')}Help</div>
  <div class="kit-menu__item">${i('settings')}Settings</div>
  <div class="kit-menu__item kit-menu__item--danger">${i('logout')}Log out</div></nav>`;
const head = (title, back) => `<div class="kit-settings__head">${back ? `<span class="kit-settings__back">${i('back')}</span>` : ''}<h2>${title}</h2><button class="kit-settings__done">Done</button></div>`;
const sec = ([n, t, s]) => `<div class="kit-settings__section">${i(n)}<span class="kit-settings__text"><b>${t}</b>${s ? `<small>${s}</small>` : ''}</span>${i('chevron', 'kit-settings__chev')}</div>`;
const row = (n, t, s, ctl) => `<div class="kit-settings__row">${i(n)}<span class="kit-settings__text"><b>${t}</b>${s ? `<small>${s}</small>` : ''}</span>${ctl}</div>`;
const seg = (o, on) => `<span class="seg">${o.map((x) => `<span class="${x === on ? 'on' : ''}">${x}</span>`).join('')}</span>`;
const wrap = (inner) => `<div class="kit-scrim">${inner}</div>`;
const list = wrap(`<section class="kit-settings">${head('Settings')}<div class="kit-settings__list"><div class="kit-settings__group">
  ${A.secs.map(sec).join('')}
  <div class="kit-settings__section kit-settings__logout">${i('logout')}<span class="kit-settings__text"><b>Log out</b></span></div></div></div></section>`);
const appearance = wrap(`<section class="kit-settings">${head('Appearance', true)}<div class="kit-settings__list">
  <div class="kit-settings__group">
    ${row('theme', 'Theme', '', seg(['Light', 'Dark'], 'Light'))}
    ${row('language', 'Language', '', `<span class="sel">English${i('chevron', 'kit-settings__chev')}</span>`)}
    ${app === 'label' ? row('units', 'Units', '', seg(['in', 'mm'], 'in')) : ''}
  </div></div></section>`);
const about = wrap(`<section class="kit-settings">${head('About', true)}<div class="kit-settings__list">
  <div class="kit-settings__group">
    ${row('info', A.name, '', `<span class="kit-settings__value">${A.ver}</span>`)}
    ${sec(['whats-new', 'What’s new', 'New features by version'])}
  </div>
  <div class="kit-settings__group-title">About us</div>
  <div class="kit-settings__group">
    ${row('language', 'Visit kit-pos.com', '', i('external', 'kit-settings__chev'))}
    ${sec(['feedback', 'Send feedback', 'Report a bug or suggest an idea'])}
  </div></div></section>`);
document.getElementById('app').innerHTML = bar + ({ menu, settings: list, section: appearance, about }[screen] || '');
</script>
</body>
</html>
