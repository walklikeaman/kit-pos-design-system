  h1 { font-size: 22px; margin: 0 0 4px; } p { margin: 0; color: var(--kit-app-muted); font-size: 14px; line-height: 1.45; }
  .theme { display: grid; gap: 10px; padding: 18px; background: var(--kit-app-bg); border-radius: 20px; }
  .wrong { opacity: .75; } .wrong b { color: var(--kit-app-error); }
  .old { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; } .old button, .old input { height: 44px; font: inherit; border-radius: 12px; border: 1px solid var(--kit-app-line); padding: 0 12px; }
