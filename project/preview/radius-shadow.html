<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-sans); background: #f0f2f5; }
  .row { display: flex; gap: 10px; margin-bottom: 14px; }
  .card { background: #fff; padding: 16px; border: 1px solid #e4e9f0; flex: 1; }
  .label { font-size: 11px; font-weight: 600; color: #1d3557; margin-bottom: 6px; }
  .val { font-size: 11px; font-family: monospace; color: #5f6b7a; }
  .shadow-row { display: flex; gap: 12px; }
  .shadow-swatch { flex: 1; background: #fff; border: 1px solid #e4e9f0; height: 52px; display: flex; align-items: center; justify-content: center; }
  .s-lbl { font-size: 11px; font-weight: 600; color: #1d3557; }
</style></head><body>
<div class="row">
  <div class="card" style="border-radius:6px"><div class="label">radius-sm · 6px</div><div class="val">badges, inner elements</div></div>
  <div class="card" style="border-radius:12px"><div class="label">radius-md · 12px</div><div class="val">dropdown items</div></div>
  <div class="card" style="border-radius:16px"><div class="label">radius-lg · 16px</div><div class="val">nav active pill</div></div>
  <div class="card" style="border-radius:20px"><div class="label">radius-xl · 20px</div><div class="val">standard cards</div></div>
  <div class="card" style="border-radius:28px"><div class="label">radius-3xl · 28px</div><div class="val">feature sections</div></div>
  <div class="card" style="border-radius:9999px"><div class="label">radius-full</div><div class="val">buttons, nav, tags</div></div>
</div>
<div class="shadow-row">
  <div class="shadow-swatch" style="border-radius:12px; box-shadow:0 8px 30px rgba(29,53,87,0.08)"><span class="s-lbl">shadow-soft</span></div>
  <div class="shadow-swatch" style="border-radius:12px; box-shadow:0 4px 16px rgba(29,53,87,0.10)"><span class="s-lbl">shadow-md</span></div>
  <div class="shadow-swatch" style="border-radius:12px; box-shadow:0 16px 48px rgba(29,53,87,0.12)"><span class="s-lbl">shadow-lg</span></div>
</div>
</body></html>
