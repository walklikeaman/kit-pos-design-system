<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-sans); background: #fff; }
  .grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
  .item { border-radius: 10px; border: 1px solid #e4e9f0; padding: 12px 14px; }
  .dot { width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(0,0,0,.06); }
  .role { font-size: 11px; font-weight: 600; color: #1d3557; margin-top: 8px; }
  .val { font-size: 10px; color: #5f6b7a; margin-top: 2px; font-family: monospace; }
</style></head><body>
<div class="grid">
  <div class="item"><div class="dot" style="background:#1d3557"></div><div class="role">Text primary</div><div class="val">kit-blue</div></div>
  <div class="item"><div class="dot" style="background:#5f6b7a"></div><div class="role">Text secondary</div><div class="val">kit-slate</div></div>
  <div class="item"><div class="dot" style="background:#94a3b8"></div><div class="role">Text muted</div><div class="val">slate-400</div></div>
  <div class="item"><div class="dot" style="background:#1d3557"></div><div class="role">CTA button</div><div class="val">kit-blue</div></div>
  <div class="item"><div class="dot" style="background:#f0f2f5; border:1px solid #e4e9f0"></div><div class="role">Section alt bg</div><div class="val">kit-mist/50</div></div>
  <div class="item"><div class="dot" style="background:#e4e9f0"></div><div class="role">Border</div><div class="val">kit-border</div></div>
  <div class="item"><div class="dot" style="background:#0ea5e9"></div><div class="role">Dark CTA</div><div class="val">sky-500</div></div>
  <div class="item"><div class="dot" style="background:#1d35570d; border:1px solid #e4e9f0"></div><div class="role">Hover fill</div><div class="val">blue/5%</div></div>
</div>
</body></html>
