<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-sans); background: #fff; }
  .row { display: flex; gap: 12px; }
  .anim-box { flex: 1; background: #f4f7fb; border: 1px solid #e4e9f0; border-radius: 16px; padding: 16px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .dot { width: 32px; height: 32px; border-radius: 50%; background: #1d3557; }
  .float { animation: kit-float 4s ease-in-out infinite; }
  .pulse { animation: kit-pulse-glow 3s ease-in-out infinite; }
  .bob { animation: kit-bob 5s ease-in-out infinite; }
  .fadein { animation: kit-fade-up 0.6s ease-out forwards; }
  .shimmer-wrap { width: 80px; height: 14px; border-radius: 9999px; background: #e4e9f0; overflow: hidden; position: relative; }
  .shimmer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent); animation: kit-shimmer 1.5s ease-in-out infinite; }
  .name { font-size: 11px; font-weight: 600; color: #1d3557; }
  .dur { font-size: 10px; color: #94a3b8; font-family: monospace; }
</style></head><body>
<div class="row">
  <div class="anim-box"><div class="dot float"></div><div class="name">float</div><div class="dur">4s ease-in-out ∞</div></div>
  <div class="anim-box"><div class="dot pulse"></div><div class="name">pulse-glow</div><div class="dur">3s ease-in-out ∞</div></div>
  <div class="anim-box"><div class="dot bob"></div><div class="name">bob</div><div class="dur">5s ease-in-out ∞</div></div>
  <div class="anim-box"><div class="dot fadein"></div><div class="name">fade-up</div><div class="dur">0.6s ease-out</div></div>
  <div class="anim-box"><div class="shimmer-wrap"><div class="shimmer"></div></div><div class="name">shimmer</div><div class="dur">1.5s ∞</div></div>
</div>
</body></html>
