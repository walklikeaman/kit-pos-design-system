<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-sans); background: #fff; }
  .grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 8px; margin-bottom: 14px; }
  .box { height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; }
  .row2 { display: flex; gap: 8px; }
  .token { flex: 1; background: #f0f2f5; border-radius: 10px; padding: 10px 12px; }
  .t-name { font-size: 11px; font-weight: 600; color: #1d3557; }
  .t-val { font-size: 11px; font-family: monospace; color: #5f6b7a; margin-top: 2px; }
</style></head><body>
<div class="grid">
  <div class="box" style="background:#1d3557; grid-column:span 2">p-5 · 20px</div>
  <div class="box" style="background:#3a5a80; grid-column:span 2">p-6 · 24px</div>
  <div class="box" style="background:#5f6b7a; grid-column:span 2">p-8 · 32px</div>
</div>
<div class="row2">
  <div class="token"><div class="t-name">Section padding</div><div class="t-val">py-14 → py-24</div></div>
  <div class="token"><div class="t-name">Container max</div><div class="t-val">max-w-6xl / 72rem</div></div>
  <div class="token"><div class="t-name">Card gap</div><div class="t-val">gap-4 to gap-6</div></div>
  <div class="token"><div class="t-name">Page padding</div><div class="t-val">px-4 sm:6 md:8</div></div>
</div>
</body></html>
