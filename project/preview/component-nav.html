<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; }
  header { border-bottom: 1px solid rgba(228,233,240,0.7); background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 15px; font-weight: 700; color: #1d3557; letter-spacing: -0.02em; }
  nav { display: flex; align-items: center; gap: 2px; }
  .nav-link { font-size: 13px; font-weight: 500; color: #5f6b7a; padding: 6px 14px; border-radius: 9999px; cursor: pointer; }
  .nav-link.active { background: #f4f7fb; color: #1d3557; }
  .toggle { width: 34px; height: 20px; background: #e4e9f0; border-radius: 9999px; cursor: pointer; position: relative; }
  .toggle-dot { width: 16px; height: 16px; background: #1d3557; border-radius: 50%; position: absolute; top: 2px; left: 2px; }
</style></head><body>
<header>
  <div class="logo">KIT POS</div>
  <nav>
    <span class="nav-link active">Home</span>
    <span class="nav-link">Partners</span>
    <span class="nav-link">Platform</span>
    <span class="nav-link">Solutions</span>
    <span class="nav-link">Contact</span>
  </nav>
  <div class="toggle"><div class="toggle-dot"></div></div>
</header>
</body></html>
