<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-sans); background: #fff; }
  .row { display: flex; gap: 12px; }
  .swatch { flex: 1; border-radius: 12px; overflow: hidden; }
  .chip { height: 64px; }
  .info { padding: 8px 10px 10px; }
  .name { font-size: 12px; font-weight: 600; color: #1d3557; }
  .val { font-size: 11px; color: #5f6b7a; margin-top: 2px; font-family: monospace; }
</style></head><body>
<div class="row">
  <div class="swatch">
    <div class="chip" style="background:#1d3557"></div>
    <div class="info"><div class="name">kit-blue</div><div class="val">#1d3557</div></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#5f6b7a"></div>
    <div class="info"><div class="name">kit-slate</div><div class="val">#5f6b7a</div></div>
  </div>
  <div class="swatch" style="border:1px solid #e4e9f0">
    <div class="chip" style="background:#f0f2f5"></div>
    <div class="info"><div class="name">kit-mist</div><div class="val">#f0f2f5</div></div>
  </div>
  <div class="swatch" style="border:1px solid #e4e9f0">
    <div class="chip" style="background:#e4e9f0"></div>
    <div class="info"><div class="name">kit-border</div><div class="val">#e4e9f0</div></div>
  </div>
  <div class="swatch" style="border:1px solid #e4e9f0">
    <div class="chip" style="background:#ffffff"></div>
    <div class="info"><div class="name">kit-white</div><div class="val">#ffffff</div></div>
  </div>
</div>
</body></html>
