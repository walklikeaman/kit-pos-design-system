<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-sans); background: #fff; }
  .section { margin-bottom: 14px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 10px; }
  .logos { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .lbox { background: #f0f2f5; border: 1px solid #e4e9f0; border-radius: 10px; padding: 8px 14px; display: flex; align-items: center; justify-content: center; height: 36px; }
  img { display: block; max-height: 22px; max-width: 80px; object-fit: contain; }
</style></head><body>
<div class="section">
  <div class="label">Hardware Partners</div>
  <div class="logos">
    <div class="lbox"><img src="../assets/pax-logo.png" alt="PAX"></div>
    <div class="lbox"><img src="../assets/sunmi-logo.png" alt="SUNMI"></div>
  </div>
</div>
<div class="section">
  <div class="label">Payment Methods</div>
  <div class="logos">
    <div class="lbox"><img src="../assets/visa.svg" alt="Visa"></div>
    <div class="lbox"><img src="../assets/mastercard.svg" alt="Mastercard"></div>
    <div class="lbox"><img src="../assets/americanexpress.svg" alt="Amex"></div>
    <div class="lbox"><img src="../assets/discover.svg" alt="Discover"></div>
    <div class="lbox"><img src="../assets/applepay.svg" alt="Apple Pay"></div>
    <div class="lbox"><img src="../assets/ebt.png" alt="EBT"></div>
  </div>
</div>
</body></html>
