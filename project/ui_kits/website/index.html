<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KIT POS — Website UI Kit</title>

  <!-- Brand font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script>
    // Apply saved theme before render to prevent flash
    (function() {
      try {
        var s = localStorage.getItem('kit-pos-theme');
        var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (s === 'dark' || (!s && sysDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    })();
  </script>

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    /* ── Brand font ── */
    body {
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s, color 0.3s;
    }

    /* ── Light theme ── */
    :root {
      --bg:          #ffffff;
      --bg-alt:      rgba(244,247,251,0.5);
      --surface:     #ffffff;
      --border:      #e4e9f0;
      --text-1:      #1d3557;
      --text-2:      #5f6b7a;
      --text-3:      #94a3b8;
      --cta:         #1d3557;
      --cta-text:    #ffffff;
      --badge-bg:    rgba(29,53,87,0.07);
      --badge-text:  #1d3557;
      --mist:        #f4f7fb;
      --dot-color:   rgba(29,53,87,0.12);
      --step-num:    #e4e9f0;
      --card-img-bg: #f4f7fb;
      --shadow:      0 8px 30px rgba(29,53,87,0.08);
      --shadow-lg:   0 16px 48px rgba(29,53,87,0.12);
    }

    /* ── Dark theme ── */
    html.dark {
      --bg:          #12161c;
      --bg-alt:      rgba(15,23,42,0.6);
      --surface:     #1b2129;
      --border:      #2c3540;
      --text-1:      #e6eaf0;
      --text-2:      #9aa6b4;
      --text-3:      #475569;
      --cta:         #e6eaf0;
      --cta-text:    #12161c;
      --badge-bg:    rgba(14,165,233,0.12);
      --badge-text:  #38bdf8;
      --mist:        #1b2129;
      --dot-color:   rgba(148,163,184,0.08);
      --step-num:    #2c3540;
      --card-img-bg: #2c3540;
      --shadow:      0 8px 30px rgba(0,0,0,0.3);
      --shadow-lg:   0 16px 48px rgba(0,0,0,0.4);
    }

    body {
      background: var(--bg);
      color: var(--text-1);
      background-image:
        radial-gradient(circle at top left, rgba(29,53,87,0.05), transparent 32%),
        radial-gradient(circle at bottom right, rgba(125,159,204,0.08), transparent 28%);
    }
    html.dark body {
      background-image:
        radial-gradient(circle at top left, rgba(56,189,248,0.06), transparent 28%),
        radial-gradient(circle at bottom right, rgba(59,130,246,0.05), transparent 22%);
    }

    /* ── Layout ── */
    .shell { max-width: 1152px; margin: 0 auto; padding: 0 24px; }
    @media (max-width: 768px) {
      .shell { padding: 0 16px; }
    }

    /* ── Typography ── */
    .kit-h1    { color: var(--text-1); }
    .kit-h3    { color: var(--text-1); }
    .kit-body  { color: var(--text-2); }
    .kit-body-sm { color: var(--text-2); }
    .kit-eyebrow { color: var(--text-2); }
    .kit-quote { color: var(--text-1); }
    .kit-section-title { color: var(--text-1); font-size: clamp(24px, 3vw, 36px); }
    .kit-section-desc  { color: var(--text-2); }

    /* ── Badge ── */
    .kit-badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 11px; font-weight: 700; letter-spacing: 0.16em;
      text-transform: uppercase; border-radius: 9999px;
      padding: 5px 14px; display: inline-block;
    }

    /* ── Buttons ── */
    .btn-primary {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--cta); color: var(--cta-text);
      border: none; border-radius: 9999px;
      padding: 11px 24px; font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: opacity 150ms; text-decoration: none;
    }
    .btn-primary:hover { opacity: 0.88; }

    .btn-ghost {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent; color: var(--text-1);
      border: 1.5px solid var(--border); border-radius: 9999px;
      padding: 10px 24px; font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: background 150ms, color 150ms;
    }
    .btn-ghost:hover { background: var(--mist); }

    /* ── Cards ── */
    .kit-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }
    .kit-card-mist {
      background: var(--mist);
      border: 1px solid var(--border);
      border-radius: 20px;
    }
    .card-img-bg { background: var(--card-img-bg); }
    .kit-dot { background: var(--cta); }

    /* ── Sections ── */
    .section-alt { background: var(--bg-alt); }

    /* ── Hero visual ── */
    .hero-visual { background: var(--mist); }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: var(--shadow);
    }

    /* ── Form inputs ── */
    .kit-input {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      background: var(--bg);
      color: var(--text-1);
      outline: none;
      transition: border-color 150ms, box-shadow 150ms;
    }
    .kit-input::placeholder { color: var(--text-3); }
    .kit-input:focus {
      border-color: var(--cta);
      box-shadow: 0 0 0 3px rgba(29,53,87,0.08);
    }
    html.dark .kit-input:focus {
      box-shadow: 0 0 0 3px rgba(14,165,233,0.12);
    }

    /* ── Footer ── */
    .kit-footer { background: var(--bg-alt); border-color: var(--border); }
    .logo-pill { background: var(--surface); border-color: var(--border); }
    .footer-copy, .footer-link { color: var(--text-2); }
    .footer-link { background: none; border: none; cursor: pointer; font-family: inherit; }
    .footer-link:hover { color: var(--text-1); }

    /* ── Step numbers ── */
    .step-num { color: var(--step-num); }

    /* ── Check icon ── */
    .check-icon { color: var(--cta); }

    /* ── Animations ── */
    @keyframes kitFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }
    @keyframes kitFadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .page-enter { animation: kitFadeUp 0.3s cubic-bezier(0.4,0,0.2,1) both; }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .desktop-nav { display: none !important; }
      .mobile-menu-btn { display: flex !important; }
      .product-grid, .stories-grid, .benefit-grid { grid-template-columns: 1fr !important; }
      .support-grid, .hw-grid { grid-template-columns: 1fr !important; }
      .support-cards { grid-template-columns: 1fr 1fr !important; }
      .rollout-grid { grid-template-columns: 1fr 1fr !important; }
    }
    @media (max-width: 640px) {
      .support-cards, .rollout-grid { grid-template-columns: 1fr !important; }
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9999px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="HomePage.jsx"></script>
  <script type="text/babel" src="Pages.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [page, setPage] = useState(() => {
        try { return localStorage.getItem('kit-pos-page') || 'home'; } catch { return 'home'; }
      });

      useEffect(() => {
        try { localStorage.setItem('kit-pos-page', page); } catch {}
        window.scrollTo({ top: 0, behavior: 'instant' });
      }, [page]);

      const renderPage = () => {
        switch (page) {
          case 'home':      return <HomePage setPage={setPage} />;
          case 'partners':  return <PartnersPage setPage={setPage} />;
          case 'platform':  return <PlatformPage />;
          case 'solutions': return <SolutionsPage setPage={setPage} />;
          case 'contact':   return <ContactPage />;
          default:          return <HomePage setPage={setPage} />;
        }
      };

      return (
        <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
          <KitHeader page={page} setPage={setPage} />
          <div key={page} className="page-enter" style={{ flex: 1 }}>
            {renderPage()}
          </div>
          <KitFooter setPage={setPage} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
