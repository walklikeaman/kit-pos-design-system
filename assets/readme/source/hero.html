<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="../../../project/colors_and_type.css">
<style>
  /* Approved KIT signature palette (page "Почерк KIT", 2026-10-26): warm/cool
     near-black, the green/amber/grey atom, NO blue. */
  html,body{margin:0}
  .stage{
    width:1200px;height:420px;box-sizing:border-box;position:relative;overflow:hidden;
    font-family:var(--font-sans);
    background:
      radial-gradient(900px 520px at 86% 32%, #34b36b2e 0%, #34b36b00 60%),
      linear-gradient(135deg, #0f1310 0%, #12161c 52%, #171c17 100%);
    color:#eef0e8;
  }
  .stage::before{
    content:"";position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(#ffffff14 1px, transparent 1.4px);
    background-size:34px 34px;
    -webkit-mask-image:linear-gradient(90deg,#0000 0%,#000 40%);
    mask-image:linear-gradient(90deg,#0000 0%,#000 40%);
  }
  .copy{position:absolute;left:64px;top:76px;width:620px;z-index:2}
  .eyebrow{font-weight:700;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:#5cc98a;margin:0 0 20px}
  h1{font-weight:700;font-size:58px;line-height:1.04;letter-spacing:-.025em;margin:0 0 20px;color:#ffffff}
  h1 .g{background:linear-gradient(90deg,#4caf67,#E2B714 55%,#cfd6dd);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{font-weight:400;font-size:19px;line-height:1.6;color:#a6ad9f;margin:0;max-width:540px}
  .atom{position:absolute;right:56px;top:50%;transform:translateY(-50%);width:330px;height:330px;z-index:1}
  .atom::after{content:"";position:absolute;inset:-12%;border-radius:50%;
    background:radial-gradient(closest-side,#34b36b55,#34b36b00 70%);filter:blur(6px)}
  .atom img{position:relative;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 40px #0009)}
  .chips{position:absolute;left:64px;bottom:40px;display:flex;gap:10px;z-index:2}
  .chips i{width:52px;height:10px;border-radius:999px;display:block}
</style></head>
<body>
  <div class="stage">
    <div class="copy">
      <p class="eyebrow">KIT POS · Design System</p>
      <h1>One visual language<br><span class="g">for every KIT product</span></h1>
      <p>Tokens, components and brand in one place — the single source of truth behind the website, the POS app, and the KIT Kitchen, Monitor, Label and Invoice apps.</p>
    </div>
    <div class="atom"><img src="../../../project/apps/kit-atom.png" alt="KIT atom"></div>
    <div class="chips">
      <i style="background:#34B36B"></i><i style="background:#177245"></i>
      <i style="background:#E2B714"></i><i style="background:#B03434"></i>
      <i style="background:#c9cdbf"></i><i style="background:#5f6559"></i>
    </div>
  </div>
</body></html>
